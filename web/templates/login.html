<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Pigeon</title>
  {{template "pageAssets" .}}
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto max-w-md px-4 py-16">
    <img class="login-logo" src="/assets/logo.webp" width="240" height="240" alt="Pigeon" />
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900/40 p-6">
      <h1 class="text-xl font-semibold"><i class="fa-solid fa-user mr-2 text-zinc-400" aria-hidden="true"></i>Sign in</h1>
      <p class="mt-2 text-sm text-zinc-400">Access, manage, and share your files.</p>
      {{if .Error}}<p role="alert" class="mt-4 rounded-lg border border-red-900 bg-red-950/40 p-3 text-sm text-red-200">{{.Error}}</p>{{end}}
      <form method="post" action="/login" class="mt-6 space-y-4">
        {{template "csrfField" .}}
        <div>
          <label for="username" class="block">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus maxlength="64" data-required-message="Enter your username."
            class="mt-2 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2" />
        </div>
        <div>
          <label for="password" class="block">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required data-required-message="Enter your password."
            class="mt-2 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2" />
        </div>
        <button type="submit" class="rounded-lg bg-zinc-100 px-4 py-2 font-semibold text-zinc-900"><i class="fa-solid fa-right-to-bracket mr-1" aria-hidden="true"></i>Sign in</button>
      </form>
    </div>
  </main>
  {{template "formValidation" .}}
</body>
</html>
