{{define "shareLifetimeOptions"}}
<option value="">Never expires</option>
<option value="1h">Expires in 1 hour</option>
<option value="24h">Expires in 1 day</option>
<option value="168h"{{if .}} selected{{end}}>Expires in 7 days</option>
<option value="720h">Expires in 30 days</option>
{{end}}

{{define "shareControls"}}
<div id="shareControls" hidden class="mt-4 space-y-6">
  <section aria-labelledby="shareHeading">
    <h3 id="shareHeading" class="font-medium text-zinc-200"><i class="fa-solid fa-download mr-1 text-zinc-400" aria-hidden="true"></i>Download link</h3>
    <div class="mt-2 flex gap-2">
      <input id="shareURL" type="url" readonly aria-labelledby="shareHeading" class="min-w-0 flex-1 rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100" />
      <button id="shareCopy" type="button" disabled class="rounded-lg bg-zinc-800 px-3 py-2 hover:bg-zinc-700 disabled:opacity-50"><i class="fa-solid fa-copy mr-1" aria-hidden="true"></i>Copy</button>
    </div>
    <p id="shareStatus" role="status" aria-live="polite" class="mt-2 text-xs text-zinc-300"></p>
    <div class="mt-3 flex flex-wrap items-center gap-2">
      <select id="shareLifetime" aria-label="Download link lifetime" class="rounded-lg border border-zinc-700 bg-zinc-950 px-2 py-2 text-zinc-100">{{template "shareLifetimeOptions" false}}</select>
      <button id="shareCreate" type="button" disabled class="rounded-lg bg-zinc-100 px-3 py-2 font-semibold text-zinc-900 hover:bg-white disabled:opacity-50"><i class="fa-solid fa-link mr-1" aria-hidden="true"></i>Create link</button>
      <button id="shareReplace" type="button" hidden class="rounded-lg bg-zinc-800 px-3 py-2 hover:bg-zinc-700 disabled:opacity-50"><i class="fa-solid fa-rotate mr-1" aria-hidden="true"></i>Replace link</button>
      <button id="shareRevoke" type="button" hidden class="rounded-lg border border-red-900 px-3 py-2 text-red-300 disabled:opacity-50"><i class="fa-solid fa-link-slash mr-1" aria-hidden="true"></i>Revoke link</button>
    </div>
  </section>
  <section id="uploadLinkControls" hidden aria-labelledby="uploadLinkHeading">
    <h3 id="uploadLinkHeading" class="font-medium text-zinc-200"><i class="fa-solid fa-cloud-arrow-up mr-1 text-zinc-400" aria-hidden="true"></i>Upload link</h3>
    <div class="mt-2 flex gap-2">
      <input id="uploadLinkURL" type="url" readonly aria-labelledby="uploadLinkHeading" class="min-w-0 flex-1 rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100" />
      <button id="uploadLinkCopy" type="button" disabled class="rounded-lg bg-zinc-800 px-3 py-2 hover:bg-zinc-700 disabled:opacity-50"><i class="fa-solid fa-copy mr-1" aria-hidden="true"></i>Copy</button>
    </div>
    <p id="uploadLinkStatus" role="status" aria-live="polite" class="mt-2 text-xs text-zinc-300"></p>
    <div class="mt-3 flex flex-wrap items-center gap-2">
      <select id="uploadLinkLifetime" aria-label="Upload link lifetime" class="rounded-lg border border-zinc-700 bg-zinc-950 px-2 py-2 text-zinc-100">{{template "shareLifetimeOptions" true}}</select>
      <button id="uploadLinkCreate" type="button" disabled class="rounded-lg bg-zinc-100 px-3 py-2 font-semibold text-zinc-900 hover:bg-white disabled:opacity-50"><i class="fa-solid fa-link mr-1" aria-hidden="true"></i>Create link</button>
      <button id="uploadLinkReplace" type="button" hidden class="rounded-lg bg-zinc-800 px-3 py-2 hover:bg-zinc-700 disabled:opacity-50"><i class="fa-solid fa-rotate mr-1" aria-hidden="true"></i>Replace link</button>
      <button id="uploadLinkRevoke" type="button" hidden class="rounded-lg border border-red-900 px-3 py-2 text-red-300 disabled:opacity-50"><i class="fa-solid fa-link-slash mr-1" aria-hidden="true"></i>Revoke link</button>
    </div>
  </section>
</div>
{{end}}

{{define "shareScript"}}
<script src="/assets/shares.js" defer></script>
{{end}}
