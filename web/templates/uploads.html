{{define "uploadControls"}}
  <div id="dropZone" hidden aria-hidden="true" class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-zinc-950/80 p-6">
    <p class="rounded-2xl border-2 border-dashed border-zinc-400 bg-zinc-900 px-8 py-6 text-lg font-semibold text-zinc-100"><i class="fa-solid fa-cloud-arrow-up mr-2 text-zinc-400" aria-hidden="true"></i>Drop to upload</p>
  </div>

  <div class="rounded-xl border border-dashed border-zinc-700 bg-zinc-950/20 p-5 text-center">
    <p class="text-sm text-zinc-300"><i class="fa-solid fa-cloud-arrow-up mr-2 text-zinc-400" aria-hidden="true"></i>Drop files or folders anywhere on this page, or choose them</p>
    <p id="directoryHelp" class="mt-1 text-xs text-zinc-500">Folders keep their names and everything in their subfolders.</p>
    <div class="mt-4 flex flex-wrap justify-center gap-2">
      <button id="chooseFiles" type="button" class="rounded-lg bg-zinc-800 px-3 py-2 font-medium text-zinc-100 hover:bg-zinc-700 disabled:cursor-not-allowed disabled:opacity-60"><i class="fa-solid fa-file mr-1" aria-hidden="true"></i>Choose files</button>
      <button id="chooseFolder" type="button" class="rounded-lg bg-zinc-800 px-3 py-2 font-medium text-zinc-100 hover:bg-zinc-700 disabled:cursor-not-allowed disabled:opacity-60"><i class="fa-solid fa-folder mr-1" aria-hidden="true"></i>Choose folder</button>
    </div>
    <input id="file" type="file" multiple hidden />
    <input id="directory" type="file" webkitdirectory multiple hidden />
    <p class="mt-4 text-xs text-zinc-500" aria-live="polite">
      Selected: <span id="fileName" class="text-zinc-300">none</span>
      <span class="mx-2 text-zinc-700">|</span>
      <span id="fileCount" class="text-zinc-300">0 files</span>
      <span class="mx-2 text-zinc-700">|</span>
      Size: <span id="fileSize" class="text-zinc-300">0 B</span>
    </p>
  </div>

  <div class="flex items-center gap-3">
    <button
      id="btn"
      class="inline-flex items-center justify-center gap-2 rounded-xl bg-zinc-100 px-4 py-2 font-semibold text-zinc-900 hover:bg-white disabled:cursor-not-allowed disabled:opacity-60"
    >
      <i class="fa-solid fa-upload" aria-hidden="true"></i>
      Upload here
    </button>

    <div class="text-xs text-zinc-500">
      <span id="phase" role="status" aria-live="polite">Idle</span>
    </div>
  </div>

  <div id="progressPanel" hidden class="rounded-xl border border-zinc-800 bg-zinc-950/30 p-4">
    <div class="flex items-center justify-between text-xs text-zinc-400">
      <div>Progress</div>
      <div><span id="pct">0%</span></div>
    </div>

    <div class="mt-2">
      <div id="progress" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="h-2 w-full overflow-hidden rounded-full bg-zinc-800">
        <div id="bar" class="h-2 w-0 rounded-full bg-zinc-200 transition-[width]"></div>
      </div>
    </div>

    <div class="mt-3 grid grid-cols-2 gap-3 text-xs sm:grid-cols-4">
      <div class="rounded-lg border border-zinc-800 bg-zinc-950/30 p-2">
        <div class="text-zinc-500">Speed</div>
        <div class="mt-1 font-mono text-zinc-200" id="spd">0 B/s</div>
      </div>
      <div class="rounded-lg border border-zinc-800 bg-zinc-950/30 p-2">
        <div class="text-zinc-500">Uploaded</div>
        <div class="mt-1 font-mono text-zinc-200"><span id="up">0 B</span></div>
      </div>
      <div class="rounded-lg border border-zinc-800 bg-zinc-950/30 p-2">
        <div class="text-zinc-500">Total</div>
        <div class="mt-1 font-mono text-zinc-200"><span id="tot">0 B</span></div>
      </div>
      <div class="rounded-lg border border-zinc-800 bg-zinc-950/30 p-2">
        <div class="text-zinc-500">Time remaining</div>
        <div class="mt-1 font-mono text-zinc-200" id="eta">—</div>
      </div>
    </div>
  </div>
{{end}}
