{{define "actionDialog"}}
<dialog id="actionDialog" data-csrf-token="{{.CSRFToken}}" aria-labelledby="actionDialogTitle" aria-describedby="actionDialogDescription" class="m-auto w-full max-w-md rounded-2xl border border-zinc-700 bg-zinc-900 p-6 text-zinc-100 shadow-xl backdrop:bg-black/70">
  <form id="actionDialogForm" method="post" action="">
    <h2 id="actionDialogTitle" class="text-lg font-semibold">Confirm action</h2>
    <p id="actionDialogDescription" hidden class="mt-3 text-sm text-zinc-300"></p>
    {{template "csrfField" .}}
    <div id="actionDialogFields"></div>
    <div id="actionDialogInputGroup">
      <label id="actionDialogLabel" for="actionDialogValue" class="mt-4 block text-zinc-300">New name</label>
      <input id="actionDialogValue" name="name" type="text" required maxlength="255" autocomplete="off" autofocus data-required-message="Enter a new name." class="mt-2 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100" />
      <p id="actionDialogHelp" hidden class="mt-2 text-xs text-zinc-400">Enter an existing folder path relative to My files. Leave empty to move to My files.</p>
    </div>
    {{template "shareControls" .}}
    <div class="mt-6 flex justify-end gap-3">
      <button id="actionDialogCancel" type="button" class="rounded-lg bg-zinc-800 px-4 py-2 hover:bg-zinc-700"><i class="fa-solid fa-xmark mr-1" aria-hidden="true"></i><span id="actionDialogCancelLabel">Cancel</span></button>
      <button id="actionDialogConfirm" type="submit" class="rounded-lg bg-zinc-100 px-4 py-2 font-semibold text-zinc-900 hover:bg-white data-[danger=true]:bg-red-600 data-[danger=true]:text-white data-[danger=true]:hover:bg-red-500"><i id="actionDialogConfirmIcon" class="fa-solid fa-check mr-1" aria-hidden="true"></i><span id="actionDialogConfirmLabel">Save</span></button>
    </div>
  </form>
</dialog>

<script src="/assets/dialog.js" defer></script>
{{template "shareScript" .}}
{{end}}
