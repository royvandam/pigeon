{{define "pageAssets"}}
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.1.0/css/all.min.css" />
<style>
  /* Keep control text consistent regardless of surrounding text utilities. */
  :where(input, select, textarea, button, label, a) {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  input::file-selector-button {
    font-size: inherit;
    line-height: inherit;
  }

  .nav-link {
    color: #a1a1aa;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 150ms;
  }

  .nav-link:hover, .nav-link:focus-visible {
    color: #fafafa;
  }

  :where(input, select, textarea)[aria-invalid="true"] {
    border-color: #ef4444;
  }

  #validationTooltip {
    position: fixed;
    inset: auto;
    z-index: 1000;
    pointer-events: none;
    width: max-content;
    max-width: min(20rem, calc(100vw - 24px));
    margin: 0;
    padding: 10px 12px;
    border: 1px solid #7f1d1d;
    border-radius: 8px;
    background: #18181b;
    color: #fecaca;
    font-size: 0.875rem;
    line-height: 1.25rem;
    overflow: visible;
    overflow-wrap: anywhere;
    box-shadow: 0 8px 24px #0006;
  }

  #validationTooltip[hidden] {
    display: none;
  }

  #validationTooltip::before {
    content: "";
    position: absolute;
    top: -5px;
    left: var(--arrow-left, 16px);
    width: 8px;
    height: 8px;
    border-top: 1px solid #7f1d1d;
    border-left: 1px solid #7f1d1d;
    background: #18181b;
    transform: rotate(45deg);
  }

  #validationTooltip[data-placement="above"]::before {
    top: auto;
    bottom: -5px;
    transform: rotate(225deg);
  }
</style>
{{end}}
