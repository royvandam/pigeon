<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Upload</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto max-w-md px-4 py-16">
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900/40 p-6">
      <h1 class="text-xl font-semibold">Sign in</h1>
      <p class="mt-2 text-sm text-zinc-400">Use your account to upload files.</p>
      {{if .Error}}<p role="alert" class="mt-4 rounded-lg border border-red-900 bg-red-950/40 p-3 text-sm text-red-200">{{.Error}}</p>{{end}}
      <form method="post" action="/login" class="mt-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
        <div>
          <label for="username" class="block text-sm">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus maxlength="64"
            class="mt-2 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2" />
        </div>
        <div>
          <label for="password" class="block text-sm">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="mt-2 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2" />
        </div>
        <button type="submit" class="rounded-lg bg-zinc-100 px-4 py-2 text-sm font-semibold text-zinc-900">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
